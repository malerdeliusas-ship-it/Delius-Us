<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <!-- Firmaets eget favikon: penselen fra logoen, samme fil som på det
         gamle nettstedet (cropped-Maler-Delius-AS-Favikon). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#022269" />
    <meta
      name="description"
      content="Maler Delius AS – profesjonelle maler- og reparasjonstjenester for hjem og bedrifter i Oslo. Bestill gratis befaring."
    />
    <title>Maler Delius AS – Profesjonell maling i Oslo</title>

    <!-- Delinger på Facebook/LinkedIn/Messenger leser ikke JavaScript,
         så kortet settes statisk her og gjelder hele nettstedet. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Maler Delius AS" />
    <meta property="og:title" content="Maler Delius AS – Profesjonell maling i Oslo" />
    <meta
      property="og:description"
      content="Profesjonelle maler- og reparasjonstjenester for hjem og bedrifter i Oslo. Bestill gratis befaring."
    />
    <meta property="og:url" content="https://www.malerdelius.no/" />
    <meta property="og:image" content="https://www.malerdelius.no/og-bilde.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="nb_NO" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Maler Delius AS – Profesjonell maling i Oslo" />
    <meta name="twitter:image" content="https://www.malerdelius.no/og-bilde.jpg" />

    <!--
      Skriftene ligger hos oss selv, i /fonter (se src/fonter.css). De tre
      vektene som brukes øverst på siden hentes med én gang, så teksten ikke
      rekker å blinke i systemskrift før den rette kommer.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonter/montserrat-400-normal-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonter/montserrat-600-normal-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonter/montserrat-700-normal-latin.woff2" />

    <!-- Bedriftskortet for Google og svarmotorer: leses uten JavaScript. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HousePainter",
        "@id": "https://www.malerdelius.no/#bedrift",

        "legalName": "Maler Delius AS",
        "url": "https://www.malerdelius.no/",
        "telephone": "+4796693780",
        "email": "malerdelius@gmail.com",
        "taxID": "934409256",
        "image": "https://www.malerdelius.no/og-bilde.jpg",
        "sameAs": [
          "https://www.facebook.com/share/1CPdfc8UBm/",
          "https://www.instagram.com/malerdelius",
          "https://www.tiktok.com/@malerdelius",
          "https://mittanbud.no/bedrift/9061904"
        ],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Ullevålsveien 76",
          "postalCode": "0454",
          "addressLocality": "Oslo",
          "addressCountry": "NO"
        },
        "areaServed": { "@type": "City", "name": "Oslo" },
        "priceRange": "$$",
        "knowsAbout": [
          "Innvendig maling",
          "Utvendig maling",
          "Reparasjon og sparkling",
          "Dekorative teknikker",

          "Fasademaling"
        ]
      }

  </head>
